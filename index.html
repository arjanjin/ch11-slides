<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บทที่ 11 การออกแบบด้วยผลตอบสนองเชิงความถี่ — สไลด์</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2216%22 fill=%22%231565C0%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2216%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22 font-weight=%22bold%22%3E11%3C/text%3E%3C/svg%3E">
<meta name="description" content="01068007 ระบบควบคุม บทที่ 11 Frequency Response Design — รศ.ดร.อาจินต์ น่วมสำราญ ภาควิชาวิศวกรรมการวัดและควบคุม สจล.">
<style>
  :root{--bg:#0d1b2a;--bar:#1565C0;--acc:#F57C00;--fg:#fff;--muted:#b0bec5}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;overflow:hidden}
  #stage{position:absolute;inset:0 0 48px 0;display:flex;align-items:center;justify-content:center}
  canvas{max-width:100%;max-height:100%;box-shadow:0 8px 40px rgba(0,0,0,.5);background:#fff}
  #bar{position:absolute;left:0;right:0;bottom:0;height:48px;background:var(--bar);
    display:flex;align-items:center;gap:8px;padding:0 12px}
  button,a.btn{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:6px;
    padding:7px 12px;font:inherit;font-size:14px;cursor:pointer;text-decoration:none}
  button:hover,a.btn:hover{background:rgba(255,255,255,.25)}
  #title{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #num{font-variant-numeric:tabular-nums;background:var(--acc);border-radius:6px;padding:5px 10px;font-size:14px}
  #prog{position:absolute;left:0;bottom:48px;height:3px;background:var(--acc);transition:width .2s}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  body.fs #bar{opacity:0;transition:opacity .3s} body.fs #bar:hover{opacity:1}
  body.fs #stage{inset:0}
  @media (max-width:600px){#title{display:none}}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas><div id="msg">กำลังโหลดสไลด์…</div></div>
<div id="prog"></div>
<div id="bar">
  <button id="prev" title="ก่อนหน้า (←)">◀</button>
  <span id="num">– / –</span>
  <button id="next" title="ถัดไป (→ / Space)">▶</button>
  <span id="title">บทที่ 11 การออกแบบด้วยผลตอบสนองเชิงความถี่ · 01068007 ระบบควบคุม · KMITL</span>
  <button id="fs" title="เต็มจอ (F)">⛶ เต็มจอ</button>
  <a class="btn" href="slides.pdf" download>⬇ PDF</a>
</div>
<script src="vendor/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="vendor/pdf.worker.min.js";
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
let doc=null,page=1,busy=false,pending=null;
function fromHash(){const n=parseInt(location.hash.slice(1));return n>0?n:1}
async function render(n){
  if(!doc)return; if(busy){pending=n;return} busy=true;
  n=Math.max(1,Math.min(doc.numPages,n)); page=n;
  const p=await doc.getPage(n), v0=p.getViewport({scale:1});
  const r=stage.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  const s=Math.min(r.width/v0.width,r.height/v0.height), v=p.getViewport({scale:s*dpr});
  cv.width=v.width; cv.height=v.height; cv.style.width=(v.width/dpr)+'px'; cv.style.height=(v.height/dpr)+'px';
  await p.render({canvasContext:ctx,viewport:v}).promise;
  document.getElementById('num').textContent=n+' / '+doc.numPages;
  document.getElementById('prog').style.width=(100*n/doc.numPages)+'%';
  history.replaceState(null,'','#'+n);
  busy=false; if(pending!==null){const q=pending;pending=null;render(q)}
  if(n<doc.numPages)doc.getPage(n+1); // prefetch
}
const go=d=>render(page+d);
document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('next').onclick=()=>go(1);
function toggleFS(){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()}
document.getElementById('fs').onclick=toggleFS;
document.addEventListener('fullscreenchange',()=>{document.body.classList.toggle('fs',!!document.fullscreenElement);setTimeout(()=>render(page),100)});
document.addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();go(1)}
  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(-1)}
  else if(e.key==='Home')render(1); else if(e.key==='End')render(doc.numPages);
  else if(e.key==='f'||e.key==='F')toggleFS();
});
stage.addEventListener('click',e=>{const x=e.clientX/window.innerWidth;go(x<0.3?-1:1)});
let tx=null;stage.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
stage.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40)go(dx<0?1:-1);tx=null});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>render(page),150)});
window.addEventListener('hashchange',()=>{const n=fromHash();if(n!==page)render(n)});
pdfjsLib.getDocument('slides.pdf').promise.then(d=>{doc=d;document.getElementById('msg').remove();render(fromHash())})
 .catch(e=>{document.getElementById('msg').textContent='โหลดสไลด์ไม่สำเร็จ: '+e.message});
</script>
</body>
</html>
